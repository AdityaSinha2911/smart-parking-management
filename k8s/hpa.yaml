apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: user-service-hpa
  namespace: parking

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
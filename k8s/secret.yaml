# TEMPLATE ONLY: do not put real credentials in Git.
# Create the Secret out-of-band for each environment, for example with:
# kubectl create secret generic parking-secret -n parking \
#   --from-literal=DB_PASSWORD="$env:DB_PASSWORD" \
#   --from-literal=JWT_SECRET="$env:JWT_SECRET"
# This manifest intentionally contains non-secret placeholders for local demos.
apiVersion: v1
kind: Secret
metadata:
  name: parking-secret
  namespace: parking
type: Opaque
stringData:
  DB_PASSWORD: "replace-before-deployment"
  JWT_SECRET: "replace-before-deployment"
